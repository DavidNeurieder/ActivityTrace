name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-security-checks:
    name: Release manifest & build checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Release manifest declares no INTERNET permission
        run: ./scripts/check-release-manifest.sh

      - name: Release manifest forbids cleartext, debuggable, and backup holes
        run: ./scripts/check-security-manifest.sh

      - name: No unencrypted export artifacts outside cleaned staging paths
        run: ./scripts/check-no-plaintext-storage.sh

      - name: List exported components for review
        run: ./scripts/check-exported-components.sh

      - name: Release build
        run: ./gradlew :app:assembleRelease

  unit-and-static-checks:
    name: Unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Unit tests (debug)
        run: ./gradlew :app:testDebugUnitTest

      - name: Unit tests (release)
        run: ./gradlew :app:testReleaseUnitTest --rerun-tasks

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Dependency vulnerability scan (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Secret scan (no obvious keys/tokens in tracked files)
        run: |
          if git grep -nEi '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?key|secret|token|password)[[:space:]]*[=:][[:space:]]*[A-Za-z0-9_+\-/]{16,}' -- . ':!*.md' ':!fastlane/*'; then
            echo "possible secret checked into the repository" >&2
            exit 1
          fi

  instrumented-tests:
    name: Instrumented tests (emulator, SQLCipher)
    if: github.repository == 'DavidNeurieleger/ActivityTrace'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          script: ./gradlew :app:connectedDebugAndroidTest