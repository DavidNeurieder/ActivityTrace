org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Deterministic R8 output for F-Droid reproducible builds
android.r8.minification-repository-mode=true
# AGP 9 migration stopgap: keep the standalone Kotlin Android plugin (KGP) and
# the legacy DSL/variant API. Both opt-outs are removed in AGP 10.
android.builtInKotlin=false
android.newDsl=false
# Silence the deprecation warnings for the two opt-outs above, plus KGP's
# "kotlin.android plugin is no longer required" notice. Remove all three
# suppression/opt-out lines together when migrating to built-in Kotlin (AGP 10).
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
kotlin.suppressGradlePluginWarnings=DeprecatedKotlinAndroidPlugin
