org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Deterministic R8 output for F-Droid reproducible builds
android.r8.minification-repository-mode=true
# AGP 9 migration stopgap: keep the standalone Kotlin Android plugin (KGP) and
# the legacy DSL/variant API. Both opt-outs are removed in AGP 10.
android.builtInKotlin=false
android.newDsl=false
